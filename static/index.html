<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebRTC Session</title>
</head>
<body>
  <div id="remoteVideo0"></div>
  <div id="remoteVideo1"></div>
  <div id="remoteVideo2"></div>
  <br/>
  <button onclick="window.startSession(0)">Start Session1</button>
  <button onclick="window.startSession(1)">Start Session2</button>
  <button onclick="window.startSession(2)">Start Session3</button>
  Logs
  <br/>
  <div id="div"></div>
<script>
  const log = msg => {
    document.getElementById('div').innerHTML += msg + '<br>';
  };

  const sdList = [null, null, null]

  const createPeerConn = id => {
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    pc.ontrack = function (event) {
      const el = document.createElement(event.track.kind);
      el.srcObject = event.streams[0];
      el.autoplay = true;
      el.controls = true;
      document.getElementById(`remoteVideo${id}`).appendChild(el);
    };

    pc.oniceconnectionstatechange = e => log(pc.iceConnectionState);

    pc.onicecandidate = async event => {
      if (event.candidate === null) {
        sdList[id] = btoa(JSON.stringify(pc.localDescription));
      }
    };

    pc.addTransceiver('video', { direction: 'sendrecv' });

    pc.createOffer()
      .then(d => pc.setLocalDescription(d))
      .catch(log);
    return pc
  }

  const pcList = [null, null, null]
  pcList[0] = createPeerConn(0)
  pcList[1] = createPeerConn(1)
  pcList[2] = createPeerConn(2)

  window.startSession = async (id) => {
    if (sdList[id] === '') {
      return alert('Local Session Description not ready yet.');
    }

    try {
      //const response = await fetch('https://greenlight.typedex.dev/v1/stream/join', {
      const response = await fetch(`http://localhost:4000/v1/stream/join/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp: sdList[id] })
      });

      if (!response.ok) {
        throw new Error('Server returned: ' + response.statusText);
      }

      const data = await response.json();
      const remoteSD = JSON.parse(atob(data.sdp)); // Assuming response is { sdp: "<base64 string>" }

      await pcList[id].setRemoteDescription(remoteSD);
      log('Remote Session Description set successfully.');
    } catch (e) {
      alert('Failed to start session: ' + e.message);
      log('Error: ' + e);
    }
  };
</script>
</body>
</html>
